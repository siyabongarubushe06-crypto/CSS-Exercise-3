<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Product Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <div class="loader">
        <div class="spinner"></div>
    </div>

    
    <nav>
        <a href="#home">Home</a>
        <a href="#products">Products</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    
    <section class="hero" id="home">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="hero-content">
            <h1>Discover Great Tech</h1>
            <p>Quality gadgets at friendly prices.</p>
            <button class="cta">Shop Now</button>
        </div>
    </section>

    
    <section id="products">
        <h2>Featured Products</h2>
        <div class="products">

            <div class="card">
                <span class="badge">NEW</span>
                <span class="icon"></span>
                <h3>Wireless Headphones</h3>
                <p class="price">R899.00</p>
                <button class="buy">Add to Cart</button>
            </div>

            <div class="card">
                <span class="badge">NEW</span>
                <span class="icon"></span>
                <h3>Smart Watch</h3>
                <p class="price">R1,499.00</p>
                <button class="buy">Add to Cart</button>
            </div>

            <div class="card">
                <span class="badge">NEW</span>
                <span class="icon"></span>
                <h3>Bluetooth Speaker</h3>
                <p class="price">R649.00</p>
                <button class="buy">Add to Cart</button>
            </div>

            <div class="card">
                <span class="badge">NEW</span>
                <span class="icon"></span>
                <h3>Laptop Backpack</h3>
                <p class="price">R499.00</p>
                <button class="buy">Add to Cart</button>
            </div>

            <div class="card">
                <span class="badge">NEW</span>
                <span class="icon"></span>
                <h3>Power Bank</h3>
                <p class="price">R349.00</p>
                <button class="buy">Add to Cart</button>
            </div>

            <div class="card">
                <span class="badge">NEW</span>
                <span class="icon"></span>
                <h3>Wireless Mouse</h3>
                <p class="price">R259.00</p>
                <button class="buy">Add to Cart</button>
            </div>

        </div>
    </section>

</body>
</html>
